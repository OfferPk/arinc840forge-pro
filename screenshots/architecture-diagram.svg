<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#0a0e17; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,monospace;">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="40" y="45" fill="#38bdf8" font-size="20" font-weight="bold" letter-spacing="1">ARINC 840 ELECTRONIC FLIGHT BAG (EFB) ELECTRONIC DISTRIBUTION OF SOFTWARE</text>
  <text x="40" y="70" fill="#94a3b8" font-size="12">Ground-to-Cockpit Secure Distribution • FAA AC 120-76E Type A/B Validation • W3C XML-DSig RSA-SHA256</text>
  <line x1="40" y1="85" x2="960" y2="85" stroke="#334155" stroke-width="1.5" />

  <!-- GROUND FLIGHT OPERATIONS CENTER (LEFT) -->
  <rect x="40" y="105" width="440" height="445" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="40" y="105" width="440" height="32" rx="8" fill="#1e293b" />
  <circle cx="60" cy="121" r="5" fill="#38bdf8" filter="url(#glow)" />
  <text x="75" y="126" fill="#38bdf8" font-size="13" font-weight="bold">AIRLINE FLIGHT OPS &amp; EFB DISTRIBUTION REPOSITORY</text>

  <!-- ARINC 840 Manifest Package -->
  <rect x="55" y="147" width="410" height="85" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="68" y="167" fill="#10b981" font-size="11" font-weight="bold">ARINC 840 XML Distribution Package</text>
  <text x="68" y="184" fill="#f8fafc" font-size="10">Package ID: PKG-840-UAL-2611-PERF • AIRAC Cycle 2611</text>
  <text x="68" y="200" fill="#94a3b8" font-size="10">Fleet Target: Boeing 787-9 • Version: v4.8.2 • Delta Sync Ready</text>
  <text x="68" y="216" fill="#10b981" font-size="10">Total Payload Size: 62.9 MB (Performance, Charts &amp; QRH Checklists)</text>

  <!-- Type A vs Type B Classification -->
  <rect x="55" y="242" width="410" height="85" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
  <text x="68" y="262" fill="#f59e0b" font-size="11" font-weight="bold">FAA AC 120-76E Regulatory Classification</text>
  <text x="68" y="280" fill="#f8fafc" font-size="10">Type A: Document Viewers (AFM, QRH checklists, company SOP)</text>
  <text x="68" y="296" fill="#10b981" font-size="10">Type B: Interactive Takeoff Performance (V1, VR, V2, derate, W&amp;B)</text>
  <text x="68" y="312" fill="#94a3b8" font-size="10">Requires Principal Operations Inspector (POI) operational authorization</text>

  <!-- Cryptographic XML-DSig -->
  <rect x="55" y="337" width="410" height="85" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
  <text x="68" y="357" fill="#ef4444" font-size="11" font-weight="bold">W3C XML Digital Signature &amp; Manifest Integrity</text>
  <text x="68" y="375" fill="#f8fafc" font-size="10">Algorithm: RSA-SHA256 with X.509 Operations Certificate Chain</text>
  <text x="68" y="391" fill="#94a3b8" font-size="10">Digest Value: e3b0c44298fc1c149afbf4c8996fb92427ae... (Tamper Proof)</text>
  <text x="68" y="407" fill="#ef4444" font-size="10">Prevents unauthorized modification of takeoff weight or thrust tables</text>

  <!-- ARINC 429 Discrete Bus -->
  <rect x="55" y="432" width="410" height="105" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="68" y="452" fill="#94a3b8" font-size="11" font-weight="bold">ARINC 429 Glass-Cockpit Discrete Bus Output</text>
  <text x="68" y="472" fill="#38bdf8" font-size="10" font-family="monospace">Label 303: EFB System Status, Sync State &amp; AIRAC Cycle [ODD OK]</text>
  <text x="68" y="492" fill="#38bdf8" font-size="10" font-family="monospace">Label 304: Takeoff Perf Engine Health &amp; W&amp;B CG Integrity [ODD OK]</text>
  <text x="68" y="512" fill="#10b981" font-size="10" font-weight="bold">Bit 32 Odd Parity Integrity Verified on Both Words</text>

  <!-- COCKPIT EFB RECEIVER DOMAIN (RIGHT) -->
  <rect x="520" y="105" width="440" height="445" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
  <rect x="520" y="105" width="440" height="32" rx="8" fill="#1e293b" />
  <circle cx="540" cy="121" r="5" fill="#10b981" filter="url(#glow)" />
  <text x="555" y="126" fill="#10b981" font-size="13" font-weight="bold">COCKPIT EFB HARDWARE PLATFORMS &amp; RUNTIME</text>

  <!-- EFB Hardware Classes -->
  <rect x="535" y="147" width="410" height="85" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="548" y="167" fill="#10b981" font-size="11" font-weight="bold">Multi-Platform Hardware Binding</text>
  <text x="548" y="184" fill="#f8fafc" font-size="10">Class 1 Portable: Apple iPad Pro (iPadOS 18) • Commercial Off-The-Shelf</text>
  <text x="548" y="200" fill="#94a3b8" font-size="10">Class 2 Mounted: Microsoft Surface Pro (Win11) • Aircraft Power &amp; Mount</text>
  <text x="548" y="216" fill="#10b981" font-size="10">Class 3 Installed: Boeing 787 / Airbus A350 Built-In Cockpit EFB Screens</text>

  <!-- Ground Interlocks -->
  <rect x="535" y="242" width="410" height="85" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
  <text x="548" y="262" fill="#ef4444" font-size="11" font-weight="bold">In-Flight Performance Swap Inhibit (AC 120-76E)</text>
  <text x="548" y="280" fill="#f8fafc" font-size="10">Software installation strictly prohibited when aircraft is airborne</text>
  <text x="548" y="296" fill="#94a3b8" font-size="10">Ground speed must equal 0.0 kt • Pilot confirmation prompt required</text>
  <text x="548" y="312" fill="#ef4444" font-size="10">Prevents mid-air calculation errors or accidental database corruption</text>

  <!-- Environmental Standards -->
  <rect x="535" y="337" width="410" height="85" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="548" y="357" fill="#38bdf8" font-size="11" font-weight="bold">EASA AMC 20-25 Environmental Suitability</text>
  <text x="548" y="375" fill="#f8fafc" font-size="10">Rapid Decompression Testing (certified to FL510 flight levels)</text>
  <text x="548" y="391" fill="#94a3b8" font-size="10">Lithium-ion battery thermal containment &amp; non-interference EMI/RFI</text>
  <text x="548" y="407" fill="#38bdf8" font-size="10">Lossless automatic rollback to previous certified AIRAC baseline</text>

  <!-- Normative Compliance Scorecard -->
  <rect x="535" y="432" width="410" height="105" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="548" y="452" fill="#10b981" font-size="11" font-weight="bold">10-Point Normative Compliance Certification</text>
  <text x="548" y="472" fill="#f8fafc" font-size="10">ARINC Specification 840-1 • FAA AC 120-76E • EASA AMC 20-25</text>
  <text x="548" y="492" fill="#f8fafc" font-size="10">RTCA DO-178C (Type B Software) • ICAO Annex 6 / Annex 15</text>
  <text x="548" y="512" fill="#10b981" font-size="11" font-weight="bold">10 / 10 CHECKS PASSED (100% ARINC_840_EFB_CERTIFIED)</text>

  <!-- Footer Banner -->
  <text x="500" y="575" fill="#64748b" font-size="11" text-anchor="middle">ARINC840Forge Pro v1.0.0 • Compliant with ARINC 840-1, FAA AC 120-76E, EASA AMC 20-25 &amp; RTCA DO-178C</text>
</svg>